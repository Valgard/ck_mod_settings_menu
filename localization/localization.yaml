# ModSettingsMenu localisation source. Generated into native TextDataBlock assets
# at build by utils/LocalizationGenerator.cs. Not an ASCII-only file (umlauts and
# sharp s render fine), but avoid U+2026 ellipsis and U+2014 em dash: write "..." and "-".
ModSettingsMenu-UI:
  Title:
    hint: "The Options-menu entry label + the screen title."
    en: "Mod settings"
    de: "Mod-Einstellungen"
  On:
    hint: "Toggle value when enabled."
    en: "on"
    de: "an"
  Off:
    hint: "Toggle value when disabled."
    en: "off"
    de: "aus"
  AutoDetected:
    hint: "Marker appended to the heading of an auto-detected (non-integrated) mod's config box."
    en: "(detected)"
    de: "(erkannt)"
  ListEmpty:
    hint: "Compact-row preview shown when a foreign list setting has zero tokens."
    en: "(empty)"
    de: "(leer)"
  ListAddButton:
    hint: "Caption of the list drill-in's trailing button, which appends an empty row."
    en: "Add entry"
    de: "Hinzufügen"
  ResetConfirm:
    hint: "Confirmation question before restoring one mod's settings to the defaults it declared. {0} is that mod's display name, inserted via string.Format."
    en: "Reset {0} to its default settings?"
    de: "{0} auf Standardwerte zurücksetzen?"
  DeleteEntryConfirm:
    hint: "Confirmation question before removing one entry from a list. {0} is that entry's text, inserted via string.Format."
    en: "Remove {0} from this list?"
    de: "{0} aus dieser Liste entfernen?"
ModSettingsMenu-Config:
  showForeignConfigs:
    hint: "Master toggle label: show config from other mods that use CoreLib config but did not integrate MSM."
    en: "Show settings from other mods"
    de: "Einstellungen anderer Mods anzeigen"
